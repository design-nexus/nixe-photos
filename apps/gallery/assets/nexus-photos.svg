<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="photoSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Drop Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" filter="url(#shadow)"/>

  <!-- Subtle Accent Ring / Frame -->
  <rect x="14" y="14" width="100" height="100" rx="20" ry="20" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Photo Card Inner Viewport -->
  <g clip-path="url(#innerClip)">
    <clipPath id="innerClip">
      <rect x="20" y="20" width="88" height="88" rx="16" ry="16"/>
    </clipPath>

    <!-- Deep Sky Backdrop -->
    <rect x="20" y="20" width="88" height="88" fill="#181825"/>

    <!-- Sun / Moon Orb -->
    <circle cx="82" cy="42" r="10" fill="url(#photoSun)"/>

    <!-- Distant Mountains -->
    <polygon points="16,108 52,56 80,108" fill="url(#mountainGrad1)" opacity="0.85"/>

    <!-- Foreground Mountain Peak -->
    <polygon points="44,108 84,48 116,108" fill="url(#mountainGrad2)"/>

    <!-- Aperture / Shutter Blade Overlay Accent in Corner -->
    <circle cx="20" cy="20" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Camera Aperture Overlay Lens Ring on Corner -->
  <circle cx="94" cy="94" r="16" fill="#181825" stroke="url(#accentGrad)" stroke-width="2"/>
  <circle cx="94" cy="94" r="8" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="92" cy="92" r="3" fill="#ffffff" opacity="0.8"/>
</svg>
