[package]
name = "nixe-photos"
version = "0.1.0"
description = "A fast, keyboard-first photo gallery for Omarchy"
edition = "2024"

[[bin]]
name = "nixe-photos"
path = "src/main.rs"

[[bin]]
name = "nixe-viewer"
path = "src/bin/nixe-viewer.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "7cd0be5d09cd1d91510794f58bbc720605951c12" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
anyhow = "1.0"
dirs = "5.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
pangocairo = "0.22"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
walkdir = "2.5"
