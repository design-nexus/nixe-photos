[package]
name = "nixe-photos"
version = "0.1.0"
description = "A fast, keyboard-first photo gallery for Omarchy"
edition = "2024"

[[bin]]
name = "nixe-photos"
path = "src/main.rs"

[[bin]]
name = "nixe-viewer"
path = "src/bin/nixe-viewer.rs"

[dependencies]
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
anyhow = "1.0"
dirs = "5.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
pangocairo = "0.22"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
walkdir = "2.5"
